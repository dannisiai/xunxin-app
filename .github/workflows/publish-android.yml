name: Prepare Android release
run-name: Android release from ${{ github.sha }}
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      version_name:
        description: Display version (blank increments the previous patch version)
        type: string
        default: ''
      release_notes:
        description: Release notes
        type: string
        default: ''
      force_update:
        description: Require installation before continuing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SELF_HOSTED_MODE: 'false'
      XUNXIN_ANDROID_BUILD: '1'
      XUNXIN_ANDROID_LOCAL: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      SIGNING_CERT_SHA256: ${{ vars.SHELL_SIGNING_CERT_SHA256 }}
      REQUESTED_VERSION: ${{ inputs.version_name }}
      REQUESTED_NOTES: ${{ inputs.release_notes }}
      FORCE_UPDATE: ${{ inputs.force_update || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configure release version
        run: |
          python3 - <<'PY'
          import json, os, re
          import urllib.request
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          with urllib.request.urlopen('https://xunxin.shop/downloads/android/version.json', timeout=20) as response:
              previous = json.loads(response.read(65537))
          code = max(28, int(previous['versionCode']) + 1)
          version = os.environ.get('REQUESTED_VERSION') or json.loads(Path('package.json').read_text())['version']
          if previous and not os.environ.get('REQUESTED_VERSION'):
              old = tuple(map(int, previous['versionName'].split('.')))
              wanted = tuple(map(int, version.split('.')))
              if wanted <= old:
                  version = f'{old[0]}.{old[1]}.{old[2] + 1}'
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Invalid display version')
          certificate = os.environ['SIGNING_CERT_SHA256']
          if not re.fullmatch(r'[0-9a-fA-F]{64}', certificate):
              raise SystemExit('Production signing certificate is not configured')
          package = temp / 'package'
          package.mkdir()
          notes = os.environ.get('REQUESTED_NOTES') or '应用更新统一使用日本服务器，缩小抖音一起看悬浮窗。'
          (package / 'notes.md').write_text(notes, encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'SHELL_VERSION_CODE={code}\nSHELL_VERSION_NAME={version}\nRELEASE_TAG=android-v{version}-{code}\n')
          print(f'Releasing {version} (Android versionCode {code})')
          PY
      - name: Check application source for removed popup
        run: node scripts/check-app-popup-bundle.cjs components lib app public android-shell/app/src/main
      - name: Build bundled application
        run: |
          npm ci
          npm run build
          python3 scripts/prepare-xunxin-android.py
          python3 scripts/install-android-node.py --install-toolchain
      - name: Build APK
        env:
          SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
          SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
          SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
          SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -n "$SHELL_KEYSTORE_BASE64" ]; then
            test -n "$SHELL_KEYSTORE_PASSWORD"
            test -n "$SHELL_KEY_ALIAS"
            test -n "$SHELL_KEY_PASSWORD"
            umask 077
            printf '%s' "$SHELL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.keystore"
            export SHELL_KEYSTORE_FILE="$RUNNER_TEMP/signing.keystore"
            echo 'CLOUD_SIGNING_CONFIGURED=true' >> "$GITHUB_ENV"
          fi
          if ! gradle -p android-shell assembleRelease lintRelease; then
            find android-shell/app/build -name lint-results-release.txt -type f -exec cat {} \;
            exit 1
          fi
      - name: Audit actual APK and prepare release artifacts
        run: |
          set -eu
          if [ "${CLOUD_SIGNING_CONFIGURED:-false}" = true ]; then
            cp android-shell/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/package/xunxin.apk"
            apk="$RUNNER_TEMP/package/xunxin.apk"
          else
            cp android-shell/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/package/xunxin-$SHELL_VERSION_NAME-unsigned.apk"
            apk="$RUNNER_TEMP/package/xunxin-$SHELL_VERSION_NAME-unsigned.apk"
          fi
          python3 scripts/check-app-popup-apk.py "$apk" --report "$RUNNER_TEMP/package/popup-audit.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = {name: os.environ[name] for name in ['SHELL_VERSION_CODE', 'SHELL_VERSION_NAME', 'RELEASE_TAG', 'GITHUB_SHA', 'GITHUB_REPOSITORY', 'SIGNING_CERT_SHA256', 'FORCE_UPDATE']}
          data['SHELL_UPDATE_URL'] = 'https://xunxin.shop/downloads/android/version.json'
          (Path(os.environ['RUNNER_TEMP']) / 'package' / 'release-metadata.json').write_text(json.dumps(data, indent=2), encoding='utf-8')
          PY
          if [ "${CLOUD_SIGNING_CONFIGURED:-false}" = true ]; then
            force=()
            if [ "$FORCE_UPDATE" = true ]; then force=(--force-update); fi
            python3 scripts/create-android-update-feed.py --apk "$apk" --notes-file "$RUNNER_TEMP/package/notes.md" --download-notes-output "$RUNNER_TEMP/package/download-notes.md" --expected-certificate-sha256 "$SIGNING_CERT_SHA256" --output "$RUNNER_TEMP/package/version.json" "${force[@]}"
          fi
      - name: Preserve release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xunxin-android-release
          path: ${{ runner.temp }}/package/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.keystore"
